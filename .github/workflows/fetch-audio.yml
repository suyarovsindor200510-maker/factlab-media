name: Fetch audio
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download audio for jobs that have no mp3 yet
        run: |
          set -e
          for f in jobs/*.json; do
            id=$(basename "$f" .json)
            [ -f "audio/$id.mp3" ] && continue
            url=$(python3 -c "import json,sys;print(json.load(open('$f'))['audio_url'])")
            curl -fsSL --retry 3 -o "audio/$id.mp3" "$url" && echo "got $id"
          done
      - name: Commit
        run: |
          git config user.name "factlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/
          git diff --cached --quiet || (git commit -m "audio: fetched" && git push)
