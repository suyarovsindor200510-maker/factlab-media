name: Listen (earshot + whisper)
on:
  push:
    paths: ["listen/*/job.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listen
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EARSHOT_HOME: /home/runner/.earshot
      HF_HOME: /home/runner/.hf
      EARSHOT_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/listen.yml
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.earshot
            /home/runner/.hf
          key: listen-models-v1-591fa3e
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          git clone -q https://github.com/Leonxlnx/earshot /tmp/earshot && git -C /tmp/earshot checkout -q 591fa3e028032e6dce56620a20e932e35667e8d8
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -e "/tmp/earshot" faster-whisper
          python -m earshot doctor --fetch
      - name: Listen
        run: python tools/listen.py
      - name: Commit
        run: |
          git config user.name "factlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f listen
          if git diff --cached --quiet; then echo "nothing"; exit 0; fi
          git commit -q -m "listen results"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
