name: STT
on:
  push:
    branches: [stt-tmp]
    paths: ["stt/*.npy", ".github/workflows/stt.yml"]
permissions:
  contents: write
jobs:
  stt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: transcribe
        run: |
          python3 - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m=WhisperModel('deepdml/faster-whisper-large-v3-turbo-ct2',device='cpu',compute_type='int8')
          import subprocess,numpy as np
          audio=np.load('stt/a${{ matrix.n }}.npy').astype(np.float32)
          segs,info=m.transcribe(audio,word_timestamps=True,vad_filter=False,beam_size=3,language='uz',initial_prompt="Assalomu alaykum. Bugun sizga qiziqarli hikoya aytib beraman. O'zbekiston, Toshkent, Samarqand, so'm, ko'k choy, qora choy.")
          out={'lang':info.language,'prob':info.language_probability,'segments':[]}
          for s in segs:
              out['segments'].append({'s':round(s.start,2),'e':round(s.end,2),'t':s.text,'w':[[round(w.start,2),round(w.end,2),w.word] for w in (s.words or [])]})
          json.dump(out,open('stt/t${{ matrix.n }}.json','w'),ensure_ascii=False)
          PY
      - name: commit
        run: |
          git config user.name "factlab-bot"; git config user.email "actions@users.noreply.github.com"
          git add stt/t${{ matrix.n }}.json; git commit -qm "stt ${{ matrix.n }}"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin stt-tmp && git push -q origin HEAD:stt-tmp && exit 0; sleep $((RANDOM%10+3)); done; exit 1
