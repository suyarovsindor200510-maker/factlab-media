name: Edge TTS
on:
  push:
    paths: ["tts/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tts
            assets/piyoz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q edge-tts
      - name: Synthesize
        run: |
          python - <<'PY'
          import json, glob, os, asyncio, edge_tts
          async def go():
              for f in sorted(glob.glob('tts/*.json')):
                  j = json.load(open(f))
                  if 'items' not in j: continue
                  for it in j['items']:
                      if 'out' not in it or 'text' not in it: continue
                      out = it['out']
                      if os.path.exists(out): continue
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      c = edge_tts.Communicate(it['text'], it.get('voice', j.get('voice', 'uz-UZ-SardorNeural')),
                                               rate=it.get('rate', j.get('rate', '+0%')), pitch=it.get('pitch', j.get('pitch', '+0Hz')))
                      await c.save(out); print('ok', out)
          asyncio.run(go())
          PY
      - name: Commit
        run: |
          git config user.name "factlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -q -m "tts files"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
