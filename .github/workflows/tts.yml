name: TTS (free Edge voices)
on:
  push:
    paths: ["tts/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts transformers torch soundfile --extra-index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - name: Edge voices (may be blocked by Microsoft)
        run: |
          mkdir -p assets && python3 pipeline/tts_edge.py || true
      - name: MMS open-source voice
        run: |
          python3 pipeline/tts_mms.py || true
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A assets
          git diff --cached --quiet || (git commit -m "tts files" && git pull --rebase && git push)
