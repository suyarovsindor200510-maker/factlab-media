<!doctype html>
<html><head><meta charset="utf-8">
<!-- FactLab "doc" engine (v9, birfoiz-style): full-bleed illustrations, slow smooth camera, minimal text, no subtitles. -->
<style>
@font-face{font-family:PF,EM;src:url(__FONTS__/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:PF,EM;src:url(__FONTS__/playfair-display-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:PF,EM;src:url(__FONTS__/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
@font-face{font-family:LO,EM;src:url(__FONTS__/lora-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:LO,EM;src:url(__FONTS__/lora-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:LO,EM;src:url(__FONTS__/lora-latin-500-italic.woff2);font-weight:500;font-style:italic}
@font-face{font-family:O,EM;src:url(__FONTS__/oswald-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:T,EM;src:url(__FONTS__/courier-prime-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M,EM;src:url(__FONTS__/montserrat-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:M,EM;src:url(__FONTS__/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:EM;src:local('Noto Color Emoji'),url(__FONTS__/NotoColorEmoji.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#15110d;color:#1d1a16}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.bg{position:absolute;left:0;top:0;width:540px;height:960px;transform-origin:50% 50%}
.bgb{position:absolute;inset:-30px;width:600px;height:1020px;filter:blur(14px) brightness(.62) saturate(.9)}
.ovw{position:absolute;transform:translate(-50%,-50%);z-index:20}
.ov{position:relative;transform-origin:50% 50%;white-space:nowrap}
.paper{background:#f1e6cf;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.title{padding:16px 26px 14px;text-align:center;min-width:420px}
.title b{display:block;font-family:PF,EM;font-weight:900;font-size:40px;letter-spacing:.02em;text-transform:uppercase;color:#1d1a16;line-height:1.05}
.title i{display:block;font-family:PF,EM;font-style:italic;font-weight:700;font-size:21px;color:#a8322b;margin-top:6px}
.name{background:#3b2a1c;color:#ffd257;font-family:O,EM;font-weight:700;font-size:21px;letter-spacing:.05em;padding:7px 14px;text-transform:uppercase;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.punch{font-family:M,EM;font-weight:900;font-size:64px;color:#ffd23f;text-transform:uppercase;letter-spacing:.01em;line-height:1;
 -webkit-text-stroke:3px #2a1d10;paint-order:stroke fill;text-shadow:0 5px 0 #2a1d10,0 10px 22px rgba(0,0,0,.55)}
.punch.w{color:#fff}
.stamp{font-family:O,EM;font-weight:700;font-size:34px;color:#b8242b;text-transform:uppercase;letter-spacing:.06em;padding:5px 16px 4px;border:4px solid #b8242b;
 outline:2px solid #b8242b;outline-offset:3px;background:rgba(246,236,214,.88);border-radius:3px}
.tag{font-family:T,EM;font-weight:700;font-size:17px;color:#2a241c;padding:6px 11px 5px;background:#f4ead2;box-shadow:0 5px 12px rgba(0,0,0,.4)}
.tag.dark{background:#2a2420;color:#ffd257}
.lower{padding:10px 18px 11px;text-align:center;max-width:470px;white-space:normal}
.lower s{display:block;text-decoration:none;font-family:T,EM;font-weight:700;font-size:14px;color:#a8322b;letter-spacing:.04em;margin-bottom:3px}
.lower b{display:block;font-family:LO,EM;font-weight:700;font-size:23px;line-height:1.2;color:#1d1a16}
.big{font-family:PF,EM;font-weight:900;font-size:76px;color:#fff;line-height:1;text-shadow:0 6px 26px rgba(0,0,0,.65);font-variant-numeric:tabular-nums}
.big small{display:block;font-family:LO,EM;font-style:italic;font-weight:500;font-size:22px;color:#f1e6cf;text-align:center;margin-top:8px}
.polar{background:#f6efe0;padding:14px 14px 0;box-shadow:0 18px 36px rgba(0,0,0,.55)}
.polar .ph{width:300px;height:300px;overflow:hidden;position:relative;background:#ddd}
.polar .ph img{position:absolute;width:300px;height:533px;object-fit:cover}
.polar .cap{font-family:O,EM;font-weight:700;font-size:20px;letter-spacing:.05em;text-align:center;padding:10px 0 12px;color:#3b2a1c;text-transform:uppercase}
.phone{width:290px;background:#1d2531;border-radius:30px;padding:18px 14px 22px;border:6px solid #0f141b;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.phone .tm{color:#dfe6ef;font-family:M,EM;font-weight:800;font-size:15px;text-align:center;margin-bottom:12px}
.phone .it{background:#f6f2ea;border-radius:14px;padding:10px 12px;margin-top:9px;display:flex;gap:10px;align-items:center;white-space:normal}
.phone .ic{flex:none;width:26px;height:26px;border-radius:50%;background:#d23a2f;color:#fff;font-family:M,EM;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center}
.phone .it.ok .ic{background:#2e9d5b}
.phone .h{font-family:M,EM;font-weight:900;font-size:15px;color:#c0322a}.phone .it.ok .h{color:#2a7d48}
.phone .t{font-family:M,EM;font-weight:800;font-size:12px;color:#333;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:22px;height:330px;padding:0 10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .v{font-family:O,EM;font-weight:700;font-size:24px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar .r{width:78px;background:#d9a032;border:3px solid #2a1d10;border-bottom:none;transform-origin:50% 100%}
.bar .l{font-family:T,EM;font-weight:700;font-size:15px;color:#2a241c;background:#f4ead2;padding:4px 8px;margin-top:8px;text-align:center;white-space:normal;max-width:110px}
/* widgets */
#tl{position:absolute;left:30px;right:30px;top:52px;z-index:40;display:none;padding:10px 16px 12px}
#tl .y{font-family:PF,EM;font-weight:900;font-size:34px;line-height:1;color:#1d1a16;font-variant-numeric:tabular-nums}
#tl .ys{font-family:LO,EM;font-weight:700;font-size:15px;color:#a8322b;margin-top:2px}
#tl .ax{position:absolute;right:16px;top:20px;width:250px;height:40px}
#tl .ln{position:absolute;left:0;right:0;top:12px;height:2px;background:#5b5045}
#tl .pr{position:absolute;left:0;top:11px;height:4px;background:#b8242b}
#tl .mk{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #b8242b;margin-left:-7px}
#tl .tk{position:absolute;top:22px;font-family:T,EM;font-weight:700;font-size:11px;color:#5b5045;transform:translateX(-50%)}
#hud{position:absolute;left:24px;right:24px;top:52px;z-index:40;display:none;justify-content:space-between;align-items:flex-start}
#hud .bat{display:flex;align-items:center;gap:8px;padding:9px 13px;font-family:M,EM;font-weight:900;font-size:16px;color:#1d1a16}
#hud .cell{position:relative;width:74px;height:26px;border:3px solid #1d1a16;border-radius:6px;padding:2px}
#hud .cell:after{content:'';position:absolute;right:-7px;top:6px;width:4px;height:9px;background:#1d1a16;border-radius:0 2px 2px 0}
#hud .fill{height:100%;border-radius:2px;background:#2e9d5b}
#hud .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#111}
#hud .clk{background:#2a2420;color:#ffd257;font-family:M,EM;font-weight:900;font-size:22px;padding:8px 14px;font-variant-numeric:tabular-nums;box-shadow:0 8px 18px rgba(0,0,0,.4)}
#cnt{position:absolute;left:0;right:0;top:150px;z-index:40;display:none;text-align:center}
#cnt .l{font-family:M,EM;font-weight:800;font-size:19px;color:#f1e6cf;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#cnt .v{font-family:M,EM;font-weight:900;font-size:34px;color:#ffd23f;text-shadow:0 3px 14px rgba(0,0,0,.7);font-variant-numeric:tabular-nums;margin-top:2px}
#logo{position:absolute;right:22px;bottom:36px;z-index:60;width:52px;height:52px;border-radius:50%;background:#15110d;border:2px solid #ffd23f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd23f;font-family:O,EM;font-weight:700;font-size:10px;letter-spacing:.06em;line-height:1.05;text-align:center}
#logo span{font-family:EM;font-size:15px}
#grain{position:absolute;inset:0;z-index:30;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;z-index:31;pointer-events:none;background:radial-gradient(120% 85% at 50% 48%,transparent 62%,rgba(20,12,4,.38) 100%)}
#warm{position:absolute;inset:0;z-index:29;pointer-events:none;background:rgba(255,214,150,.05);mix-blend-mode:multiply}
#cap{position:absolute;left:0;right:0;bottom:170px;display:flex;justify-content:center;z-index:45}
#capT{display:inline-block;max-width:460px;text-align:center;font-family:M,EM;font-weight:900;font-size:22px;line-height:1.25;color:#fff;padding:2px 14px;
 -webkit-text-stroke:2px #1a120a;paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.6)}
#capT i{font-style:normal;color:#ffd23f}
</style></head><body>
<div id="cam"></div>
<canvas id="grain" width="270" height="480" style="width:540px;height:960px"></canvas><div id="warm"></div><div id="vig"></div>
<div id="tl" class="paper"><div class="y" id="tlY"></div><div class="ys" id="tlS"></div><div class="ax"><div class="ln"></div><div class="pr" id="tlP"></div><div class="mk" id="tlM"></div></div></div>
<div id="hud"><div class="bat paper"><span id="hudL"></span><div class="cell"><div class="fill" id="hudF"></div><div class="pct" id="hudP"></div></div></div><div class="clk" id="hudC"></div></div>
<div id="cnt"><div class="l" id="cntL"></div><div class="v" id="cntV"></div></div>
<div id="cap"><span id="capT"></span></div>
<div id="logo"><span>💡</span>FACT<br>LAB</div>
<script>
const SPEC=__SPEC__,TL=__TL__,ROOT='__ROOT__';
const $=id=>document.getElementById(id);
const C=x=>Math.min(1,Math.max(0,x)),P=(u,a,b)=>C((u-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const E={o3:t=>1-Math.pow(1-t,3),io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,s:t=>t*t*(3-2*t),
 bk:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const st=TL.starts,du=TL.durs,SC=SPEC.scenes,N=SC.length;
const fmt=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function torn(a=4){const p=[];const n=16;for(let k=0;k<=n;k++)p.push(`${k/n*100}% ${(rnd()*a).toFixed(1)}%`);p.push(`${100-rnd()*1.2}% 50%`);
 for(let k=n;k>=0;k--)p.push(`${k/n*100}% ${(100-a+rnd()*a).toFixed(1)}%`);p.push(`${rnd()*1.2}% 50%`);return `polygon(${p.join(',')})`}
const tx=s=>(s||'').replace(/\[(.+?)\]/g,'<em style="font-style:normal;color:#b8242b">$1</em>').replace(/\n/g,'<br>');
// scene windows: scene i is on screen from st[i]-.12 until st[i+1]-.12 (cuts land just before the line starts)
function win(i){return [i==0?0:st[i]-.12,i<N-1?st[i+1]-.12:TL.total]}
// default camera alternates; values: [scale0,scale1,x0,x1,y0,y1]
const CAMS={in:[1.0,1.075,0,0,0,0],out:[1.085,1.0,0,0,0,0],left:[1.1,1.1,22,-22,0,0],right:[1.1,1.1,-22,22,0,0],up:[1.1,1.1,0,0,26,-26],down:[1.1,1.1,0,0,-26,26],none:[1,1,0,0,0,0]};
const cam=$('cam');
SC.forEach((s,i)=>{const d=document.createElement('div');d.className='sc';d.id='s'+i;let h='';
 if(s.blurbg)h+=`<img class="bgb" src="${ROOT}/${s.img}">`;
 else if(s.img)h+=`<img class="bg" src="${ROOT}/${s.img}" style="transform-origin:${(s.focus||[50,50])[0]}% ${(s.focus||[50,50])[1]}%">`;
 if(s.dim)h+=`<div style="position:absolute;inset:0;background:rgba(15,10,5,${s.dim})"></div>`;
 (s.ov||[]).forEach((o,j)=>{const ty=o.type;let inner='',cls='ov '+ty,sty='';
  if(ty=='title'){cls+=' paper';inner=`<b>${tx(o.t)}</b>${o.sub?`<i>${o.sub}</i>`:''}`;sty=`clip-path:${torn(5)}`}
  else if(ty=='name')inner=o.t;
  else if(ty=='punch'){inner=o.t;if(o.white)cls+=' w';if(o.size)sty=`font-size:${o.size}px`}
  else if(ty=='stamp'){inner=o.t;if(o.size)sty=`font-size:${o.size}px`}
  else if(ty=='tag'){inner=o.t;if(o.dark)cls+=' dark'}
  else if(ty=='lower'){cls+=' paper';inner=`${o.small?`<s>${o.small}</s>`:''}<b>${tx(o.t)}</b>`;sty=`clip-path:${torn(6)}`}
  else if(ty=='big')inner=`<span class="num" data-v="${o.v!=null?o.v:''}" data-p="${o.pre||''}" data-u="${o.unit||''}" data-d="${o.dec||0}">${o.t||''}</span>${o.sub?`<small>${o.sub}</small>`:''}`;
  else if(ty=='polar'){const im=o.img||s.img;inner=`<div class="ph"><img src="${ROOT}/${im}" style="left:${-(o.cx||0)}px;top:${-(o.cy||110)}px"></div><div class="cap">${o.t||''}</div>`;sty=`transform:rotate(${o.r||-3}deg)`}
  else if(ty=='phone')inner=`<div class="tm">${o.time||''}</div>${o.items.map(x=>`<div class="it ${x.ok?'ok':''}"><div class="ic">${x.ok?'✓':'!'}</div><div><div class="h">${x.h}</div>${x.t?`<div class="t">${x.t}</div>`:''}</div></div>`).join('')}`;
  else if(ty=='bars'){const mx=o.max||Math.max(...o.items.map(x=>x.v));inner=o.items.map(x=>`<div class="bar"><div class="v" data-v="${x.v}" data-u="${o.unit||''}" data-d="${o.dec||0}">0</div><div class="r" style="height:${Math.max(6,x.v/mx*250)}px;${x.c?`background:${x.c}`:''}"></div><div class="l">${x.l}</div></div>`).join('')}
  h+=`<div class="ovw" style="left:${o.x||270}px;top:${o.y||480}px"><div class="${cls}" data-j="${j}" style="${sty}">${inner}</div></div>`});
 d.innerHTML=h;cam.appendChild(d)});
// tick marks of the timeline
const TLW=SPEC.timeline;if(TLW){const ax=document.querySelector('#tl .ax');const [a,b]=TLW.range;(TLW.ticks||[]).forEach(y=>{ax.insertAdjacentHTML('beforeend',`<div class="tk" style="left:${(y-a)/(b-a)*100}%">${y}</div>`)});$('tl').style.clipPath=torn(4)}
// subtitles (off by default — birfoiz style has none)
function capW(t){const el=$('capT');const W=TL.words;if(!SPEC.subs||!W){el.style.opacity=0;return}for(let i=0;i<N;i++){const ws=W[i];if(!ws||!ws.length)continue;const a=ws[0][1],b=ws[ws.length-1][2];if(t<a-.05||t>b+.3)continue;
  const g=[];let cur=[];for(const w of ws){if(cur.length&&(cur.map(x=>x[0]).join(' ')+' '+w[0]).length>24){g.push(cur);cur=[]}cur.push(w)}if(cur.length)g.push(cur);
  let G=g[0];for(const x of g)if(t>=x[0][1]-.05)G=x;const html=G.map(w=>t>=w[1]-.03&&t<w[2]+.08?`<i>${w[0]}</i>`:w[0]).join(' ');if(el.innerHTML!==html)el.innerHTML=html;el.style.opacity=1;return}
 el.style.opacity=0}
// grain frames
const GR=[];for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=270;c.height=480;const g=c.getContext('2d');const im=g.createImageData(270,480);
 for(let p=0;p<im.data.length;p+=4){const v=rnd()*255;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255}g.putImageData(im,0,0);GR.push(c)}
function anim(e,o,ut,D){const at=o.at||0,end=o.until!=null?o.until:1e9;const ty=o.type;let op=P(ut,at,at+.08)*(1-P(ut,end,end+.2)),s=1,y=0,r=o.r||0;
 if(ty=='punch'){const k=P(ut,at,at+.38);s=L(.35,1,E.bk(k));r=(o.r!=null?o.r:-3)}
 else if(ty=='stamp'){const k=P(ut,at,at+.22);s=L(2.1,1,E.o3(k));r=(o.r!=null?o.r:-7);op=P(ut,at,at+.05)*(1-P(ut,end,end+.2))}
 else if(ty=='title'||ty=='lower'){const k=P(ut,at,at+.45);y=(1-E.o3(k))*26}
 else if(ty=='name'||ty=='tag'){const k=P(ut,at,at+.3);s=L(.6,1,E.bk(k));r=o.r!=null?o.r:(ty=='tag'?-2:0)}
 else if(ty=='polar'){const k=P(ut,at,at+.5);s=L(.82,1,E.o3(k));y=(1-E.o3(k))*40;r=0}
 else if(ty=='phone'){const k=P(ut,at,at+.45);y=(1-E.o3(k))*160;
  e.querySelectorAll('.it').forEach((it,q)=>{const t0=(o.ats||[])[q]!=null?o.ats[q]:at+.45+q*(o.step||.55);const kk=P(ut,t0,t0+.25);it.style.opacity=P(ut,t0,t0+.06);it.style.transform=`scale(${L(.85,1,E.bk(kk))})`})}
 else if(ty=='bars'){e.querySelectorAll('.bar').forEach((b,q)=>{const t0=at+q*(o.step||.35);const kk=E.o3(P(ut,t0,t0+.7));b.querySelector('.r').style.transform=`scaleY(${kk})`;const v=b.querySelector('.v');v.style.opacity=P(ut,t0+.3,t0+.4);const dd=+v.dataset.d;v.textContent=(dd?(+v.dataset.v*kk).toFixed(dd):fmt(+v.dataset.v*kk))+v.dataset.u})}
 else if(ty=='big'){const k=P(ut,at,at+.4);s=L(1.3,1,E.o3(k));const n=e.querySelector('.num');if(n.dataset.v!==''){const kk=E.o3(P(ut,at,at+(o.count||1.2)));const dd=+n.dataset.d;n.textContent=n.dataset.p+(dd?(+n.dataset.v*kk).toFixed(dd).replace('.',','):fmt(+n.dataset.v*kk))+n.dataset.u}}
 e.style.opacity=op;e.style.transform=`translateY(${y}px) rotate(${r}deg) scale(${s})`}
function render(t){
 for(let i=0;i<N;i++){const el=$('s'+i);const [a,b]=win(i);if(t<a-.2||t>=b+.2){el.style.display='none';continue}el.style.display='block';
  const s=SC[i],ut=t-st[i],D=b-a;
  // tiny cross-dissolve (.16s) between shots, no flash, no shake
  const fi=i==0?1:E.s(P(t,a-.08,a+.08)),fo=i==N-1?1:1-E.s(P(t,b-.08,b+.08));el.style.opacity=Math.min(fi,fo);el.style.zIndex=10+i;
  const img=el.querySelector('.bg');if(img){const c=s.camv||CAMS[s.cam||(i%2?'out':'in')];const q=E.io(C((t-a)/Math.max(.8,D)));
   img.style.transform=`translate(${L(c[2],c[3],q)}px,${L(c[4],c[5],q)}px) scale(${L(c[0],c[1],q)})`}
  (s.ov||[]).forEach((o,j)=>{const e=el.querySelector(`.ov[data-j="${j}"]`);anim(e,o,ut,D)})}
 // widgets
 let i=0;for(let k=0;k<N;k++)if(t>=st[k]-.12)i=k;
 if(TLW){$('tl').style.display='block';const s=SC[i];let y=s.year,ys=s.ysub;for(let k=i;k>=0&&y==null;k--)y=SC[k].year;for(let k=i;k>=0&&ys==null;k--)ys=SC[k].ysub;
  let yp=null;for(let k=i-1;k>=0;k--)if(SC[k].year!=null){yp=SC[k].year;break}const q=E.o3(P(t,st[i]-.1,st[i]+.6));const yv=(yp!=null&&s.year!=null)?Math.round(L(yp,s.year,q)):y;
  $('tlY').textContent=y!=null?(String(y).match(/^-?\d+$/)?yv:y):'';$('tlS').textContent=ys||'';const [ra,rb]=TLW.range;const yn=parseFloat(yv);if(!isNaN(yn)){const f=C((yn-ra)/(rb-ra))*100;$('tlM').style.left=f+'%';$('tlP').style.width=f+'%'}
